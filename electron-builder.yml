appId: dev.fenncode.desktop
productName: Fenn Code
# Windows and macOS program file; the window, shortcuts and installer say Fenn Code.
executableName: FennCode
copyright: Copyright © 2026 Fenn Code contributors
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources/
    to: .
    filter: ["**/*", "!mock-agent.mjs"]
asarUnpack:
  - "**/*.node"
mac:
  category: public.app-category.productivity
  target: [dmg, zip]
win:
  target: [nsis, zip]
  artifactName: Fenn-Code-${version}-win.${ext}
nsis:
  artifactName: Fenn-Code-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Utility
  executableName: fenn-code
  target: [AppImage, deb]
  maintainer: Fenn Code contributors
