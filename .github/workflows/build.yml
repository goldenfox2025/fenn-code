name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # Releases are Windows only; macOS (no signing identity) and Linux build from source.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test Qoder runtime selection on this platform
        run: npx vitest run test/qoder-paths.test.ts
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libgbm1 libasound2t64
      - name: Test the packaged Linux app
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:package
      - name: Test the packaged Windows app
        if: runner.os == 'Windows'
        run: npm run test:package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-smoke-${{ matrix.os }}
          path: release/package-smoke/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: fenn-code-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.zip
          if-no-files-found: ignore
