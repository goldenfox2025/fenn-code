name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # macOS is not yet verified on real machines: its results are reported but don't fail the run
    # (stage-release.yml only accepts a run that succeeded, and releases carry Windows builds).
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libgbm1 libasound2t64
      # Builds the app and drives it with Playwright against the built-in demo agent.
      - name: End-to-end UI checks
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e -- release/e2e-shots
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'Linux'
        with:
          name: e2e-shots
          path: release/e2e-shots/*.png
          if-no-files-found: ignore

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dist: --linux
          - os: windows-latest
            dist: --win
          # No Apple Developer ID: an ad-hoc signed zip per architecture (see electron-builder.yml).
          - os: macos-latest
            dist: --mac zip --arm64 --x64
    runs-on: ${{ matrix.os }}
    # Releases are Windows only; a macOS packaging problem must not block them (see the test job).
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist -- ${{ matrix.dist }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libgbm1 libasound2t64
      - name: Test the packaged Linux app
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:package
      - name: Test the packaged app
        if: runner.os != 'Linux'
        run: npm run test:package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-smoke-${{ matrix.os }}
          path: release/package-smoke/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: fenn-code-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.zip
            release/*.dmg
          if-no-files-found: ignore
