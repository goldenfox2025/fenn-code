name: Stage release assets

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful build workflow run containing the installers
        required: true
        type: string
      tag:
        description: Existing draft release tag
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate the build and draft release
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > /tmp/build.json
          gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > /tmp/release.json
          python3 - <<'PY'
          import json, os
          build = json.load(open('/tmp/build.json'))
          release = json.load(open('/tmp/release.json'))
          assert build['conclusion'] == 'success', 'Build must pass'
          assert build['path'] == '.github/workflows/build.yml', 'Expected the build workflow'
          assert build['repository']['full_name'] == os.environ['GH_REPO'], 'Unexpected repository'
          assert build['head_repository']['full_name'] == os.environ['GH_REPO'], 'Fork builds are not release sources'
          assert release['isDraft'], 'Release must still be a draft'
          assert release['targetCommitish'] == build['head_sha'], 'Draft must pin the tested commit SHA'
          PY
      - name: Download the tested installers
        shell: bash
        run: |
          set -euo pipefail
          # Releases carry Windows builds only; macOS and Linux build from source.
          gh run download "$BUILD_RUN" --name ancora-windows-latest --dir installers/windows-latest
      - name: Check assets and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          files = sorted(Path('installers').glob('*/*'), key=lambda p: p.name)
          assert len(files) == 2, 'Expected the Windows installer and zip'
          assert len({p.name for p in files}) == len(files), 'Duplicate asset names'
          assert all(p.is_file() and p.stat().st_size > 0 for p in files), 'Empty installer'
          assert sorted(p.suffix for p in files) == ['.exe', '.zip'], 'Unexpected asset types'
          with open('SHA256SUMS', 'w') as sums:
              for path in files:
                  with path.open('rb') as stream:
                      digest = hashlib.file_digest(stream, 'sha256').hexdigest()
                  # GitHub normalizes spaces in release asset names to dots.
                  asset_name = path.name.replace(' ', '.')
                  sums.write(f'{digest}  {asset_name}\n')
          PY
      - name: Attach assets to the draft
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" installers/*/* SHA256SUMS --clobber
          echo 'Assets staged. The release remains a draft for final verification.' >> "$GITHUB_STEP_SUMMARY"
